name: Signaux Kronos

on:
  schedule:
    - cron: "17 5 * * *"   # every day, 05:17 UTC (after the daily candle closes)
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:                     # also when the forecasting code changes
    branches: [main]
    paths: ["kronos/**", ".github/workflows/signals.yml"]

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Comité IA : le premier fournisseur configuré est utilisé (voir kronos/committee.py).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kronos/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r kronos/requirements.txt

      - name: Get Kronos model code (pinned)
        run: |
          git clone https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          git -C /tmp/Kronos checkout 67b630e67f6a18c9e9be918d9b4337c960db1e9a

      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-weights-small-v1

      - name: Fetch prices and forecast
        env:
          KRONOS_DIR: /tmp/Kronos
          KRONOS_MODEL: small
        run: python kronos/forecast.py --out data/signals.json

      - name: Crypto quotes
        continue-on-error: true
        run: python kronos/fetch_prices.py --out data/prices.json

      - name: ETF quotes
        continue-on-error: true
        run: python kronos/fetch_etf.py --out data/etf.json

      - name: Cache modèle local
        if: github.event_name != 'push' && env.GROQ_API_KEY == '' && env.GEMINI_API_KEY == '' && env.OPENROUTER_API_KEY == '' && env.ANTHROPIC_API_KEY == ''
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Modèle local gratuit (sans clé)
        if: github.event_name != 'push' && env.GROQ_API_KEY == '' && env.GEMINI_API_KEY == '' && env.OPENROUTER_API_KEY == '' && env.ANTHROPIC_API_KEY == ''
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_MODELS="$HOME/.ollama/models"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$OLLAMA_MODEL"
          echo "OLLAMA_URL=http://localhost:11434" >> "$GITHUB_ENV"

      - name: Agent (stratégies en test et trading fictif)
        continue-on-error: true
        run: python kronos/paper.py --out data/agent.json

      - name: Publish
        run: |
          git config user.name "kronos-bot"
          git config user.email "kronos-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Signaux du $(date -u +%F)"
          git push
